name: Package extension zip

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      # actions/upload-artifactが指定パスを自動でzip化するので、
      # ここで手動zipすると「zipの中にzip」の二重構造になってしまう。
      # extensionフォルダをそのまま渡し、artifactのzip化に任せる。
      - uses: actions/upload-artifact@v4
        with:
          name: SetPeta-v${{ steps.version.outputs.version }}
          path: extension/
