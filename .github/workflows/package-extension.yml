name: Package extension zip

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        run: |
          cd extension
          zip -r "../Setpita-v${{ steps.version.outputs.version }}.zip" . -x ".*"

      - uses: actions/upload-artifact@v4
        with:
          name: Setpita-v${{ steps.version.outputs.version }}
          path: Setpita-v${{ steps.version.outputs.version }}.zip
