<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>SetPita | セトピタ</title>
<style>
  :root {
    --bg: #f7f7fa;
    --panel-bg: #ffffff;
    --border: #e0e0e6;
    --text: #202124;
    --text-muted: #6b6b75;
    --accent: #6c5ce7;
    --accent-text: #ffffff;
    --danger: #e05260;
    --playing-bg: #e8f7ee;
    --playing-text: #1a7f4b;
    --idle-bg: #f0f0f4;
    --idle-text: #6b6b75;
    --badge-bg: #eee0ff;
    --badge-text: #6c3fc5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c22;
      --panel-bg: #2a2a33;
      --border: #3c3c46;
      --text: #f0f0f4;
      --text-muted: #a0a0ac;
      --accent: #9b8bf4;
      --accent-text: #1c1c22;
      --danger: #f28b93;
      --playing-bg: #1e3a2a;
      --playing-text: #6fdb9c;
      --idle-bg: #33333c;
      --idle-text: #a0a0ac;
      --badge-bg: #3a2f57;
      --badge-text: #c9b6ff;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-width: 280px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
  }

  section {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #playbackStatus {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    background: var(--idle-bg);
    color: var(--idle-text);
  }
  #playbackStatus.playing {
    background: var(--playing-bg);
    color: var(--playing-text);
  }
  #playbackStatusNote {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 6px;
  }

  #logList {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #logList:empty::after {
    content: "まだログがありません";
    color: var(--text-muted);
  }

  .log-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .log-row .time {
    flex: 0 0 auto;
    color: var(--text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .log-row .badge {
    flex: 0 0 auto;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
  }
  .log-row input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
  }

  label {
    display: block;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 6px;
  }

  input[type="text"],
  textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  #setlistOutput {
    height: 200px;
    resize: vertical;
    margin-bottom: 8px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    background: var(--idle-bg);
    color: var(--text);
  }
  button:hover {
    filter: brightness(0.95);
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  button.danger-outline {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
    cursor: pointer;
  }

  /* トグルスイッチ風チェックボックス */
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--idle-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  input[type="checkbox"]::before {
    content: "";
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::before {
    transform: translateX(14px);
  }

  .hours-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    margin-left: 42px;
    font-size: 12px;
  }
  .hours-row input[type="number"] {
    width: 64px;
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .hours-row input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .hours-row span {
    color: var(--text-muted);
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 4px 0 8px;
  }
  footer a {
    display: block;
    flex: 1 1 200px;
    max-width: 260px;
    line-height: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    opacity: 0.85;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  footer a:hover {
    opacity: 1;
    transform: translateY(-1px);
  }
  footer img {
    display: block;
    width: 100%;
    min-width: 200px;
    object-fit: cover;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }
  .header-row h1 {
    margin: 0;
  }
  #appInfo {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  #appInfo a {
    color: var(--text-muted);
    text-decoration: none;
  }
  #appInfo a:hover {
    text-decoration: underline;
  }
  #appInfo .sep {
    margin: 0 4px;
  }
</style>
</head>
<body>
  <div class="header-row">
    <h1>SetPita | セトピタ</h1>
    <div id="appInfo">
      <span id="appVersionInfo"></span>
      <span class="sep">|</span>
      <a id="storePageLink" href="#" target="_blank" rel="noopener">ストアページ</a>
      <span class="sep">|</span>
      <a href="welcome.html" target="_blank" rel="noopener">使い方</a>
      <span class="sep">|</span>
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSc936k4LTVJZzBZMBQ1SdROUtrJaWJwZEEPSIeHn8hGXwykMQ/viewform?usp=header"
        target="_blank"
        rel="noopener"
        >不具合報告</a
      >
    </div>
  </div>

  <section>
    <h2>再生状況</h2>
    <div id="playbackStatus">■ 再生していません</div>
    <div id="playbackStatusNote"></div>
  </section>

  <section>
    <h2>記録ログ</h2>
    <div id="logList"></div>
    <div class="actions" style="margin-top: 8px;">
      <button id="clearLogsBtn" class="danger-outline">ログをクリア</button>
    </div>
  </section>

  <section>
    <h2>セトリ生成</h2>
    <label for="firstSongTimeInput">1曲目のアーカイブ開始時刻(例 3:45 または 1:03:45)</label>
    <input type="text" id="firstSongTimeInput" placeholder="mm:ss" />
    <div class="actions" style="margin-top: 8px;">
      <button id="generateBtn" class="primary">セトリ生成</button>
    </div>
  </section>

  <section>
    <h2>出力結果</h2>
    <textarea id="setlistOutput"></textarea>
    <div class="actions">
      <button id="copyBtn">コピー</button>
    </div>
  </section>

  <section>
    <h2>設定</h2>
    <label class="toggle-row">
      <input type="checkbox" id="autoResetEnabledInput" />
      <span>一定時間操作がなければログを自動リセットする</span>
    </label>
    <div class="hours-row" id="autoResetHoursRow">
      <input type="number" id="autoResetHoursInput" min="1" step="1" />
      <span>時間経過でリセット</span>
    </div>
  </section>

  <footer>
    <a href="https://manachitose.booth.pm/items/7671332" target="_blank" rel="noopener" title="TokiSync 販売中！">
      <img src="https://manachitose.github.io/TokiSync/icons/TokiSync_og_image.jpg" alt="TokiSync 販売中！" />
    </a>
    <a href="https://manachitose.github.io/" target="_blank" rel="noopener" title="クリエイター/千歳愛 HP">
      <img src="https://manachitose.github.io/assets/images/home_og_image.jpg" alt="クリエイター/千歳愛 HP" />
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
