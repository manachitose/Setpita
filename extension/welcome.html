<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SetPita</title>
<style>
  :root {
    --bg: #f7f7fa;
    --panel-bg: #ffffff;
    --border: #e0e0e6;
    --text: #202124;
    --text-muted: #6b6b75;
    --accent: #6c5ce7;
    --accent-soft: #f0edff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c22;
      --panel-bg: #2a2a33;
      --border: #3c3c46;
      --text: #f0f0f4;
      --text-muted: #a0a0ac;
      --accent: #9b8bf4;
      --accent-soft: #353147;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.7;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  .lead {
    color: var(--text-muted);
    margin-bottom: 32px;
  }
  .step {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .step.primary {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .step h2 {
    font-size: 15px;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    flex: 0 0 auto;
  }
  .step p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
  }
  .step.primary p { color: var(--text); }
  code {
    background: var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  @media (max-width: 480px) {
    body { padding: 32px 16px 48px; }
    .step { padding: 16px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="welcomeTitle"></h1>
    <p class="lead" data-i18n="welcomeLead"></p>

    <section class="step primary">
      <h2><span class="step-num">📌</span><span data-i18n="welcomeStep1Title"></span></h2>
      <p data-i18n="welcomeStep1Body"></p>
    </section>

    <section class="step">
      <h2><span class="step-num">1</span><span data-i18n="welcomeStep3Title"></span></h2>
      <p data-i18n="welcomeStep3Body"></p>
    </section>

    <section class="step">
      <h2><span class="step-num">2</span><span data-i18n="welcomeStep4Title"></span></h2>
      <p data-i18n="welcomeStep4Body"></p>
    </section>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
